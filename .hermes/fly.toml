app = "jump-section-hermes"
primary_region = "nrt"  # n8n(.n8n/fly.toml)과 동일 리전 — Fly 프라이빗 네트워크(6PN)로 지연 최소화

[build]
  image = "jump-section-hermes:latest"  # Node 20 + pnpm 9 + git + hermes gateway 사전설치 이미지 (직접 빌드)

[env]
  HERMES_GATEWAY_PORT = "8644"
  GENERIC_TIMEZONE    = "Asia/Seoul"
  TZ                  = "Asia/Seoul"

# 의도적으로 [http_service]를 선언하지 않는다 — Fly의 퍼블릭 엣지 프록시에 노출하지 않기 위해서다.
# n8n(jump-section-n8n 앱)에서만 6PN 프라이빗 네트워크로 `jump-section-hermes.internal:8644`
# 주소로 접근한다. 항상 최소 1대가 떠 있어야 하므로 배포 후 `fly scale count 1`로 고정한다.

[[mounts]]
  source      = "hermes_data"
  destination = "/data"  # ~/.hermes(스킬/curator/구독 상태) + pnpm store 캐시 영속화

[[vm]]
  memory = "2gb"  # turbo build + vitest 동시 실행 여유 (n8n의 512mb보다 크게)
  cpus   = 1
