# Hermes Agent 설정 템플릿 — 실제 시크릿 값은 .hermes/.env에서 주입한다(gitignore 처리됨).
# 배포 시 ~/.hermes/config.yaml로 복사하고 환경변수를 실제 값으로 치환한다.
# 정확한 키 이름/문법은 설치된 Hermes 버전 문서(hermes-agent.nousresearch.com/docs)로 재확인할 것 —
# 이 파일은 라우트↔스킬 매핑을 PR 리뷰 대상으로 남기기 위한 선언적 템플릿이다.

platforms:
  webhook:
    enabled: true
    extra:
      port: ${HERMES_GATEWAY_PORT}
      auth:
        mode: generic_v2 # X-Webhook-Signature-V2 + X-Webhook-Timestamp, 300초 이내만 허용
        secret_env: HERMES_WEBHOOK_SECRET
      rate_limit_per_minute: 30
      routes:
        - name: fix-build
          skill: fix-build
          terminal_backend: local # 파일럿 단계: concurrency=1, Docker-in-Fly 안정성 확인 후 재검토
          concurrency: 1
        - name: fix-lint
          skill: fix-lint
          terminal_backend: local
          concurrency: 1
        - name: fix
          skill: fix-review-comment
          terminal_backend: local
          concurrency: 1

mcp_servers:
  github:
    enabled: true
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${HERMES_GITHUB_PAT}
    allowed_tools:
      - mcp_github_get_pull_request
      - mcp_github_get_pull_request_files
      - mcp_github_get_check_runs
      - mcp_github_add_issue_comment
      - mcp_github_add_reply_to_pull_request_comment
      - mcp_github_add_reaction
      # repo 설정/워크플로우 변경 도구는 명시적으로 제외한다 (최소 권한 원칙)

curator:
  enabled: true
  consolidate: true # 반복되는 CI 에러 패턴에서 자동 생성된 보조 스킬 중복 통합
  stale_after_days: 30

cron:
  # 주간 curator 유지보수
  - schedule: '0 9 * * 1' # 매주 월요일 09:00 (Asia/Seoul)
    run: 'hermes curator run'
  # 후속 과제(cron 기반 pull 모델) — 1차 파일럿에서는 비활성화. 웹훅 경로가 안정화된 뒤 검토.
  # - schedule: '30m'
  #   skills: [fix-build, fix-lint]
  #   context_from: "open PRs with failing checks in bae080311/jump-section"
