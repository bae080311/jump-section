name: Claude Code

# PR/이슈에서 @claude 를 멘션하면 응답한다 (interactive mode — prompt 입력이 없을 때).
# 이전의 /fix-build, /fix-lint, /fix 슬래시 커맨드를 대체한다. 그 커맨드들이 하던
# 커맨드 감지·write 권한 확인·진행 상황 코멘트를 이 액션이 자체적으로 수행하므로,
# slash-fix.yml + n8n comment-fix + Hermes 3개 스킬이 전부 이 파일 하나로 줄었다.
#
# 포맷만 필요할 때는 LLM을 쓰지 않는 auto-format.yml (workflow_dispatch) 가 더 싸고 빠르다.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    # 러너가 무관한 코멘트에 뜨지 않게 먼저 걸러낸다 (액션도 자체적으로 다시 확인한다)
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # 액션의 기본 GitHub App 인증에 필요
      actions: read # PR의 CI 결과를 읽기 위해

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # API 키 대신 구독 토큰을 쓴다 — 이 방식은 API 과금이 아니라 Claude 구독으로 실행된다.
          # `claude setup-token` 으로 생성해 저장소 Secrets 에 넣는다.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 25
          # github_token 은 의도적으로 넘기지 않는다 — 기본 GITHUB_TOKEN 으로 만든 커밋에는
          # GitHub가 워크플로우를 트리거하지 않아서 ci.yml 이 안 돌게 된다. 넘기지 않으면
          # 액션이 Claude GitHub App 으로 인증하고, 그 커밋은 CI를 정상적으로 트리거한다.
