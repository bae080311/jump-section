name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Bump version
        run: pnpm run version:bump

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "chore: bump version [skip ci]" || exit 0
          # push 실패는 삼키지 않는다. main 브랜치 보호 규칙(PR 필수)을
          # 켜면 이 push가 막히는데, || exit 0 이 그것까지 삼켜서 버전 bump 커밋은 사라지고
          # 다음 스텝의 npm publish 는 그대로 실행됐다 — npm 에 main 에 없는 버전이 올라간다.
          git push

      - name: Publish core to npm
        run: cd packages/core && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update lockfile after core publish
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update lockfile [skip ci]" || exit 0
          # push 실패는 삼키지 않는다. main 브랜치 보호 규칙(PR 필수)을
          # 켜면 이 push가 막히는데, || exit 0 이 그것까지 삼켜서 버전 bump 커밋은 사라지고
          # 다음 스텝의 npm publish 는 그대로 실행됐다 — npm 에 main 에 없는 버전이 올라간다.
          git push

      - name: Publish react, vue, and svelte to npm
        run: |
          cd packages/react && npm publish --access public
          cd ../vue && npm publish --access public
          cd ../svelte && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
