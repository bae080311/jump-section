name: Weekly Planning

# 매주 월요일 09:00 (KST) 에 저장소 상태를 보고 개선 이슈를 제안한다.
# .n8n/workflows/planning-pipeline.json 의 포팅 — 9개 노드(GitHub 조회 2회 + Gemini 호출 +
# JSON 파싱 + 이슈 생성 + 집계 + Discord)가 프롬프트 하나로 줄었다.
# 생성된 이슈에 `ai-implement` 라벨을 붙이면 ai-implement.yml 이 구현까지 이어받는다.
#
# 주의: 공개 저장소의 schedule 트리거는 60일간 저장소 활동이 없으면 GitHub이 자동 비활성화한다.
# 또한 schedule 은 기본 브랜치의 워크플로우 파일만 실행한다.

on:
  schedule:
    - cron: '0 0 * * 1' # 월요일 00:00 UTC = 09:00 Asia/Seoul
  workflow_dispatch: # 수동 실행으로 검증할 수 있게

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50 # 최근 커밋 이력을 읽기 위해

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Bash 로 실행하는 gh 인증용
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
            --allowedTools "Bash,Read,Glob,Grep"
          prompt: |
            jump-section 저장소(IntersectionObserver 기반 섹션 스크롤 관리 라이브러리,
            패키지: @jump-section/core, /react, /vue, /svelte)의 주간 기획을 수행한다.

            1. 현재 상태를 파악한다:
               - `gh issue list --state open --limit 30 --json number,title,labels`
               - `git log --oneline -30` (지난주 작업 흐름)
               - CLAUDE.md 와 packages/core/src/ScrollManager.ts 를 읽어 실제 API 표면을 확인한다.

            2. 개선 아이디어를 **최대 5개** 제안한다. 규칙:
               - 이미 열려 있는 이슈와 중복되면 제안하지 않는다. 중복 여부를 반드시 먼저 확인한다.
               - 코드에 근거가 있는 것만 제안한다. 추측으로 기능을 발명하지 않는다.
               - 하위 호환성 규칙(CLAUDE.md「하위 호환성 규칙」)을 깨는 제안은 하지 않는다.
               - 제안할 것이 5개보다 적으면 적게 만든다. 숫자를 채우려고 억지 제안을 하지 않는다.
                 제안할 만한 것이 없으면 이슈를 만들지 않고 그렇다고 보고한다.

            3. 각 아이디어를 `gh issue create` 로 등록한다:
               - 제목: 영어, 50자 이내
               - 라벨: `enhancement,ai-proposal`
               - 본문 구성: `## Summary` / `## Proposed Solution` / `## Acceptance Criteria`
                 (체크박스 목록), 그리고 근거가 된 파일 경로를 명시한다.
               - 본문 마지막 두 줄:
                 `구현을 맡기려면 \`ai-implement\` 라벨을 붙이세요.`
                 `🤖 Generated by jump-section AI Pipeline`

            4. 마지막으로 생성한 이슈 번호와 제목을 목록으로 출력한다.
