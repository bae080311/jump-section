name: Auto Format

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to format'
        required: true
        type: string

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      # 이 워크플로우는 contents:write 로 커밋을 만들고 push 한다. 가드가 없으면
      # branch: main 으로 dispatch 하는 것만으로 보호 브랜치에 직접 커밋된다 —
      # CLAUDE.md "AI 파이프라인 거버넌스" 의 불변식을 저장소에서 유일하게 우회하는 경로였다.
      # 패턴은 scripts/protected-branches.sh (SSOT) 에서 가져온다.
      - name: 보호 브랜치 가드
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          # shellcheck source=scripts/protected-branches.sh
          source scripts/protected-branches.sh
          if [[ "$TARGET_BRANCH" =~ $PROTECTED_PATTERN ]]; then
            echo "::error::보호 브랜치($TARGET_BRANCH)에는 자동 포맷 커밋을 push할 수 없습니다. PR 브랜치를 지정하세요."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier
        run: pnpm run format

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No format changes" || (
            git add -A &&
            git commit -m "chore: auto format [skip ci]"
          )

      - name: Push
        run: git push
