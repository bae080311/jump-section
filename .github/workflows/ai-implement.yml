name: AI Implement Issue

# 이슈에 `ai-implement` 라벨이 붙으면 사람 개입 없이 구현해서 Draft PR 까지 만든다.
# 이 잡이 끊어져 있던 루프를 잇는다 — 원래 이 단계를 담당했던
# .n8n/workflows/development-pipeline.json 은 커밋 cbc4284 에서 삭제됐고,
# 그 뒤로 이슈는 생성되지만 아무도 구현하지 않는 상태였다.
#
# prompt 입력이 있으므로 automation mode 로 돌고, 멘션을 기다리지 않는다.
# prompt 에는 저장소의 스킬을 그대로 호출한다 — 브랜치 규칙(ai/issue-N-설명),
# 테스트+문서+타입 동반 규칙, [AI] 접두어 Draft PR 규칙이 전부 그 스킬에 있다.

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ai-implement'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      # 스킬 파일(.claude/skills/)이 러너에 있어야 prompt 의 스킬 호출이 해석된다
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/implement-issue ${{ github.event.issue.number }}'
          claude_args: |
            --max-turns 40
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
          # 이 저장소의 .claude/settings.json PreToolUse 훅이 여기서도 적용되므로,
          # block-protected-push.sh 가 CI 에이전트의 보호 브랜치 push 도 막는다.

      - name: 실패 시 이슈에 알림
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '⚠️ 자동 구현이 실패했습니다.',
                '',
                `[워크플로우 실행 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '`ai-implement` 라벨을 떼고 다시 붙이면 재시도합니다.',
                '',
                '🤖 Generated by jump-section AI Pipeline',
              ].join('\n'),
            });
